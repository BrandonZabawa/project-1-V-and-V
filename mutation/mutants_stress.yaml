# FIFO mutation pool -- STUDENT-WRITTEN STRESS POOL (not a course pool).
# Hidden-style one-line bugs against dut/fifo.sv, in the harness YAML format.
# `class` is my own label: boundary / overlap / reset / pointer / data / unspecified / equivalent.
dut: fifo.sv
mutants:
  - id: simul_count_inc
    class: overlap
    desc: "a true simultaneous read+write increments the count"
    find: "default: cnt <= cnt;"
    replace: "default: cnt <= (do_wr & do_rd) ? cnt + 1'b1 : cnt;"
  - id: simul_write_lost
    class: overlap
    desc: "the write half of a simultaneous read+write is dropped (count still right)"
    find: "if (do_wr) begin"
    replace: "if (do_wr & ~do_rd) begin"
  - id: simul_read_stalls
    class: overlap
    desc: "the read pointer does not advance on a simultaneous read+write"
    find: "if (do_rd) begin"
    replace: "if (do_rd & ~do_wr) begin"
  - id: write_when_full_if_reading
    class: overlap
    desc: "a write at full is accepted when a read happens on the same edge"
    find: "assign do_wr = wr_en & ~full;"
    replace: "assign do_wr = wr_en & (~full | rd_en);"
  - id: read_when_empty_if_writing
    class: overlap
    desc: "a read at empty is accepted when a write happens on the same edge"
    find: "assign do_rd = rd_en & ~empty;"
    replace: "assign do_rd = rd_en & (~empty | wr_en);"
  - id: write_beats_reset
    class: reset
    desc: "reset is skipped on any cycle where wr_en is high"
    find: "if (!rst_n) begin"
    replace: "if (!rst_n && !wr_en) begin"
  - id: reset_keeps_count
    class: reset
    desc: "reset does not clear the count"
    find: "cnt    <= '0;"
    replace: "cnt    <= cnt;"
  - id: reset_keeps_rdptr
    class: reset
    desc: "reset does not clear the read pointer"
    find: "rd_ptr <= '0;"
    replace: "rd_ptr <= rd_ptr;"
  - id: reset_keeps_wrptr
    class: reset
    desc: "reset does not clear the write pointer"
    find: "wr_ptr <= '0;"
    replace: "wr_ptr <= wr_ptr;"
  - id: rdptr_wrap_early
    class: pointer
    desc: "read pointer wraps one slot early"
    find: "rd_ptr <= (rd_ptr == ADDRW'(DEPTH-1)) ? '0 : rd_ptr + 1'b1;"
    replace: "rd_ptr <= (rd_ptr == ADDRW'(DEPTH-2)) ? '0 : rd_ptr + 1'b1;"
  - id: wrptr_wrap_to_one
    class: pointer
    desc: "write pointer wraps to slot 1 instead of slot 0"
    find: "wr_ptr      <= (wr_ptr == ADDRW'(DEPTH-1)) ? '0 : wr_ptr + 1'b1;"
    replace: "wr_ptr      <= (wr_ptr == ADDRW'(DEPTH-1)) ? ADDRW'(1) : wr_ptr + 1'b1;"
  - id: count_rd_inc
    class: boundary
    desc: "a read-only cycle increments the count"
    find: "2'b01:   cnt <= cnt - 1'b1;"
    replace: "2'b01:   cnt <= cnt + 1'b1;"
  - id: count_saturates_below_full
    class: boundary
    desc: "the count stops at DEPTH-1, so full never asserts"
    find: "2'b10:   cnt <= cnt + 1'b1;"
    replace: "2'b10:   cnt <= (cnt == DEPTH-1) ? cnt : cnt + 1'b1;"
  - id: full_stuck_low
    class: boundary
    desc: "full compares against DEPTH+1 and never asserts"
    find: "assign full    = (cnt == DEPTH);"
    replace: "assign full    = (cnt == DEPTH+1);"
  - id: empty_from_pointers
    class: boundary
    desc: "empty is derived from pointer equality, so it also asserts at full"
    find: "assign empty   = (cnt == 0);"
    replace: "assign empty   = (wr_ptr == rd_ptr);"
  - id: write_while_full_corrupts_head
    class: boundary
    desc: "a dropped write still writes memory and moves wr_ptr (overwrites the head)"
    find: "if (do_wr) begin"
    replace: "if (wr_en) begin"
  - id: read_while_empty_moves_rdptr
    class: boundary
    desc: "an ignored read still advances the read pointer"
    find: "if (do_rd) begin"
    replace: "if (rd_en) begin"
  - id: mem_msb_dropped
    class: data
    desc: "the MSB of every stored word is forced to 0"
    find: "mem[wr_ptr] <= wr_data;"
    replace: "mem[wr_ptr] <= {1'b0, wr_data[WIDTH-2:0]};"
  - id: mem_bit_coupling
    class: data
    desc: "bit 0 of a stored word is XORed with bit 7 (coupling fault)"
    find: "mem[wr_ptr] <= wr_data;"
    replace: "mem[wr_ptr] <= wr_data ^ {{(WIDTH-1){1'b0}}, wr_data[WIDTH-1]};"
  - id: slot5_bit3_stuck1
    class: data
    desc: "slot 5, bit 3 reads back stuck at 1"
    find: "assign rd_data = mem[rd_ptr];"
    replace: "assign rd_data = (rd_ptr == ADDRW'(5)) ? (mem[rd_ptr] | WIDTH'(8)) : mem[rd_ptr];"
  - id: head_shows_input_on_simul_at_one
    class: overlap
    desc: "with count==1 and both enables high, rd_data shows wr_data instead of the head"
    find: "assign rd_data = mem[rd_ptr];"
    replace: "assign rd_data = (cnt == 1 && wr_en && rd_en) ? wr_data : mem[rd_ptr];"
  - id: empty_bypass_leaks_input
    class: unspecified
    desc: "while empty, rd_data shows wr_data (a live bypass of the input bus)"
    find: "assign rd_data = mem[rd_ptr];"
    replace: "assign rd_data = empty ? wr_data : mem[rd_ptr];"
  - id: empty_reads_zero
    class: unspecified
    desc: "while empty, rd_data is forced to zero instead of the stale slot"
    find: "assign rd_data = mem[rd_ptr];"
    replace: "assign rd_data = empty ? '0 : mem[rd_ptr];"
  - id: full_from_pointers
    class: equivalent
    desc: "full derived from pointer equality plus a nonzero count (logically identical)"
    find: "assign full    = (cnt == DEPTH);"
    replace: "assign full    = (wr_ptr == rd_ptr) && (cnt != 0);"
